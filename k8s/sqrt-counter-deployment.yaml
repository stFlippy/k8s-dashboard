apiVersion: v1
kind: Namespace
metadata:
  name: quota-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqrt-counter
  namespace: quota-demo
  labels:
    app.kubernetes.io/name: sqrt-counter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sqrt-counter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sqrt-counter
    spec:
      containers:
        - name: sqrt-counter
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -u
            - -c
            - |
              import math
              import time

              n = 0
              while True:
                  print(f"n={n} sqrt(n)={math.sqrt(n):.3f}", flush=True)
                  n += 1
                  time.sleep(30)
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      securityContext:
        seccompProfile:
          type: RuntimeDefault
