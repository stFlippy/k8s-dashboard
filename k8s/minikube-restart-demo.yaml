apiVersion: apps/v1
kind: Deployment
metadata:
  name: restart-demo
  labels:
    app: restart-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restart-demo
  template:
    metadata:
      labels:
        app: restart-demo
    spec:
      containers:
        - name: restart-demo
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              touch /tmp/healthy
              echo "Container started at $(date). It will become unhealthy in 120 seconds."
              sleep 120
              rm -f /tmp/healthy
              echo "Health file removed at $(date). Waiting for the liveness probe to restart the container."
              sleep 3600
          livenessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/healthy
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          resources:
            requests:
              cpu: 5m
              memory: 4Mi
            limits:
              cpu: 20m
              memory: 16Mi
